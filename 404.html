<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found &middot; Orville Rockwell Jr.</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap">
<style>
:root{--bg:#0A0C11;--card:#11151C;--line:#222935;--fg:#ECEFF4;--muted:#A2AAB6;--ml:#929FFF;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,Helvetica,Arial,sans-serif;
 display:grid;place-items:center;text-align:center;
 padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.box{max-width:440px;display:flex;flex-direction:column;gap:14px;align-items:center}
.code{font-size:13px;font-weight:600;letter-spacing:.14em;color:var(--ml)}
h1{margin:0;font-size:clamp(28px,6vw,38px);font-weight:800;letter-spacing:-.02em}
p{margin:0;color:var(--muted);line-height:1.65}
a.home{margin-top:8px;display:inline-block;background:var(--ml);color:#0A0C11;font-weight:600;font-size:14px;
 text-decoration:none;padding:11px 18px;border-radius:12px}
a.home:hover{background:#A9B3FF}
</style>
</head>
<body>
  <div class="box">
    <span class="code">404</span>
    <h1>That page isn't here</h1>
    <p>The link may be out of date, or the page may have moved. Everything lives on the main page.</p>
    <a class="home" href="/">Back to the homepage</a>
  </div>
</body>
</html>
